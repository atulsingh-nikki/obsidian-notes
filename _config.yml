title: Atul Singh Notes
description: Explore the long-form research and book projects stored in this repository.
markdown: kramdown
kramdown:
  input: GFM
  math_engine: null
  syntax_highlighter: rouge
remote_theme: pages-themes/cayman@v0.2.0
repository: atulsingh-nikki/obsidian-notes
url: "https://atulsingh-nikki.github.io"
baseurl: "/obsidian-notes"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
github:
  is_project_page: false
future: true

# Keep orphaned notes, templates, and tooling out of the published site.
# (Research/**/*.md note files are still copied so the reader can fetch them.)
exclude:
  - Current Status.md
  - Deep Research Prompt.md
  - ResearchTempalte.md
  - README.md
  - Untitled.base
  - _config-backup.yml
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
  - .venv/
  - "Research/Current Status.md"
  - "Research/Deep Research Prompt.md"
  - "Research/ResearchTempalte.md"
  - "Research/Index.md"

# Render every Research note as a real, styled page (they all carry front matter).
defaults:
  - scope:
      path: "Research"
    values:
      layout: research-note

# Configure Google Analytics by setting a measurement ID.
# Update this value to change the property that receives traffic metrics.
google_analytics: G-3X6LQQ24YV
